# How each connector's requests become Cedar requests. Keyed by connector slug;
# a request to a connector host that no route names is refused.
booking:
  - method: POST
    path: /v1/search
    action: booking.search
    resource:
      type: Search
  - method: POST
    path: /v1/quote
    action: booking.quote
    resource:
      type: Quote
      attribute_map:
        cabin: /cabin
  - method: POST
    path: /v1/reserve
    action: booking.reserve
    # The session's approved mission, as context.mission, and the answers of
    # judges/booking.yaml, as context.judgement.
    context: [mission, judgement]
    judge: booking
    resource:
      type: Booking
      attribute_map:
        offer_id: /offer_id
        purpose: /purpose
        payer: /payer
      # Read from the quote the provider signed; it books only a quote it
      # signed, so the agent cannot alter these.
      claims:
        from: /quote
        attributes: [kind, name, city, flight, from, to, depart, check_in, check_out, nights, cabin, block_minutes, total_cents]
  - method: POST
    path: /v1/cancel
    action: booking.cancel
    context: [mission]
    resource:
      type: Cancellation
      attribute_map:
        confirmation: /confirmation

# The trip the agent proposes to the traveller's Person Server, which the
# egress answers itself: Jev checks it against what the traveller asked for.
person-server:
  - method: POST
    path: /mission
    action: mission.propose
    context: [judgement]
    judge: mission-proposal
    resource:
      type: TripProposal
      attribute_map:
        description: /description
  - method: POST
    path: /mission/*
    action: mission.complete
    context: [mission]
    resource:
      type: TripCompletion
      attribute_map:
        summary: /summary
