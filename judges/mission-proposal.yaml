# Asked of Jev when the agent proposes a trip to the traveller's Person Server.
name: mission-proposal
type: mission
description: Is the proposed trip the one the traveller asked for?
attributes: [description]
questions:
  requested:
    instructions: >
      Is the proposed trip the one the traveller asked for: the same destination and
      dates, suggesting a budget no higher than either the budget they named or the
      quoted total of the bookings the proposal lists? The dates are the trip's span,
      so a proposal that lists only some of its flights is still the same trip. A
      suggested budget above the one they named is fine only when it is that quoted
      total and the proposal names their budget beside it: the manager decides.
    criteria:
      "true": The trip they described, suggesting no more than their budget or, saying so, the quoted total of what it lists.
      "false": Another place or dates, or a suggested budget above both their budget and the listed quotes' total.
